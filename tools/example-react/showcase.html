<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gcode-preview-react — showcase</title>
    <!-- Shared design system (workspace-internal, not a published UI kit). -->
    <style>
      /* App layout — chrome only; the renderer viewport theme stays independently configurable. */
      body.gp-app {
        display: grid;
        grid-template-rows: auto 1fr auto;
      }
      .sc-header {
        display: flex;
        align-items: center;
        gap: var(--gp-space-3);
        padding: var(--gp-space-2) var(--gp-space-3);
        background: var(--gp-surface-2);
        border-bottom: 1px solid var(--gp-border);
      }
      .sc-header .sc-brand {
        display: flex;
        flex-direction: column;
        line-height: 1.15;
        margin-right: var(--gp-space-2);
      }
      .sc-header .sc-spacer {
        flex: 1;
      }
      .sc-main {
        display: grid;
        grid-template-columns: 1fr 340px;
        min-height: 0;
      }
      .sc-viewport {
        position: relative;
        min-width: 0;
        background: var(--gp-viewport);
      }
      .sc-viewport canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .sc-legend-card {
        position: absolute;
        top: var(--gp-space-3);
        left: var(--gp-space-3);
        background: color-mix(in srgb, var(--gp-surface) 88%, transparent);
        border: 1px solid var(--gp-border);
        border-radius: var(--gp-radius);
        padding: var(--gp-space-2) var(--gp-space-3);
        max-width: 260px;
        backdrop-filter: blur(6px);
      }
      .sc-cam {
        position: absolute;
        top: var(--gp-space-3);
        right: var(--gp-space-3);
        display: flex;
        gap: var(--gp-space-2);
      }
      .sc-count {
        position: absolute;
        bottom: var(--gp-space-3);
        left: var(--gp-space-3);
        font-family: var(--gp-mono);
        font-size: 11px;
        color: var(--gp-text);
        background: color-mix(in srgb, var(--gp-surface) 80%, transparent);
        border: 1px solid var(--gp-border);
        border-radius: 20px;
        padding: 3px 10px;
      }
      .sc-rail {
        border-left: 1px solid var(--gp-border);
        background: var(--gp-surface);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .sc-rail .gp-scroll {
        flex: 1;
      }
      .sc-status {
        display: flex;
        align-items: center;
        gap: var(--gp-space-3);
        padding: var(--gp-space-2) var(--gp-space-3);
        background: var(--gp-surface-2);
        border-top: 1px solid var(--gp-border);
        font-size: 11.5px;
        color: var(--gp-text-muted);
      }
      .sc-status .sc-spacer {
        flex: 1;
      }
      .sc-caps {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      @media (max-width: 900px) {
        .sc-main {
          grid-template-columns: 1fr;
          grid-template-rows: 1fr auto;
        }
        .sc-rail {
          border-left: none;
          border-top: 1px solid var(--gp-border);
          max-height: 44vh;
        }
      }
    </style>
  </head>
  <body class="gp-app">
    <div id="app" style="display: contents"></div>
    <script type="module" src="/src/showcase.jsx"></script>
  </body>
</html>
