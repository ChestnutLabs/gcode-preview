<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gcode-preview-react — minimal model viewer</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #10151b;
        color: #dfe7ef;
        display: grid;
        grid-template-rows: auto 1fr;
        height: 100vh;

        display: flex;
