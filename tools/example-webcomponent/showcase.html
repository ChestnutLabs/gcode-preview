<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gcode-preview element — showcase</title>
    <style>
      /* App layout — chrome only; the renderer viewport theme stays independently configurable. */
      body.gp-app {
        display: grid;
        grid-template-rows: auto 1fr auto;
      }
      .sc-header {
        display: flex;
        align-items: center;
        gap: var(--gp-space-3);
        padding: var(--gp-space-2) var(--gp-space-3);
        background: var(--gp-surface-2);
        border-bottom: 1px solid var(--gp-border);
      }
      .sc-header .sc-brand {
        display: flex;
        flex-direction: column;
        line-height: 1.15;
        margin-right: var(--gp-space-2);
      }
      .sc-header .sc-spacer {
        flex: 1;
      }
      .sc-main {
        display: grid;
        grid-template-columns: 1fr 340px;
        min-height: 0;
      }
      .sc-viewport {
        position: relative;
        min-width: 0;
        background: var(--gp-viewport);
      }
      .sc-viewport gcode-preview,
      .sc-viewport gcode-model-viewer {
        display: block;
        width: 100%;
        height: 100%;
      }
      /* A CSS `display` rule beats the UA `[hidden]` rule, so restore hiding explicitly for the two
         viewers we swap between Preview and Prepare. */
      .sc-viewport gcode-preview[hidden],
      .sc-viewport gcode-model-viewer[hidden] {
        display: none;
      }
      .sc-legend-card {
        position: absolute;
        top: var(--gp-space-3);
        left: var(--gp-space-3);
        background: color-mix(in srgb, var(--gp-surface) 88%, transparent);
        border: 1px solid var(--gp-border);
        border-radius: var(--gp-radius);
        padding: var(--gp-space-2) var(--gp-space-3);
        max-width: 260px;
        backdrop-filter: blur(6px);
      }
      .sc-cam {
        position: absolute;
        top: var(--gp-space-3);
        right: var(--gp-space-3);
        display: flex;
        gap: var(--gp-space-2);
      }
      .sc-count {
        position: absolute;
        bottom: var(--gp-space-3);
        left: var(--gp-space-3);
        font-family: var(--gp-mono);
        font-size: 11px;
        color: var(--gp-text);
        background: color-mix(in srgb, var(--gp-surface) 80%, transparent);
        border: 1px solid var(--gp-border);
        border-radius: 20px;
        padding: 3px 10px;
      }
      .sc-rail {
        border-left: 1px solid var(--gp-border);
        background: var(--gp-surface);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .sc-rail .gp-scroll {
        flex: 1;
      }
      .sc-status {
        display: flex;
        align-items: center;
        gap: var(--gp-space-3);
        padding: var(--gp-space-2) var(--gp-space-3);
        background: var(--gp-surface-2);
        border-top: 1px solid var(--gp-border);
        font-size: 11.5px;
        color: var(--gp-text-muted);
      }
      .sc-status .sc-spacer {
        flex: 1;
      }
      .sc-caps {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      @media (max-width: 900px) {
        .sc-main {
          grid-template-columns: 1fr;
          grid-template-rows: 1fr auto;
        }
        .sc-rail {
          border-left: none;
          border-top: 1px solid var(--gp-border);
          max-height: 44vh;
        }
      }
    </style>
  </head>
  <body class="gp-app">
    <header class="sc-header">
      <div class="sc-brand">
        <span class="gp-title">G-code Preview · Web Component</span>
        <span class="gp-eyebrow">Showcase</span>
      </div>
      <!-- Preview (sliced toolpath) vs Prepare (source model) — the two halves of the SDK. -->
      <div class="gp-segment" role="group" aria-label="Workflow">
        <button id="modePreview" class="gp-on">Preview</button>
        <button id="modePrepare">Prepare</button>
      </div>
      <!-- One select, repopulated per mode: toolpath fixtures in Preview, MODEL_FIXTURES in Prepare. -->
      <select id="fixture" class="gp-input" style="width: 220px"></select>
      <button id="load" class="gp-btn gp-primary">Load</button>
      <div class="sc-spacer"></div>
      <div class="gp-segment" role="group" aria-label="Chrome theme">
        <button id="chromeDark" class="gp-on">Dark</button>
        <button id="chromeLight">Light</button>
      </div>
    </header>

    <div class="sc-main">
      <div class="sc-viewport" id="viewport">
        <!-- The published Web Component. Objects (source, colorMode) are properties; primitives
             (layer-range, show-travel, view, frame-content) are attributes. -->
        <gcode-preview id="view" frame-content="object" quality="auto"></gcode-preview>
        <!-- The Prepare-side viewer: source-model (STL / 3MF). `source` is a property; `view` and
             `background` are attributes. Hidden until the Prepare mode is selected. -->
        <gcode-model-viewer id="modelView" view="iso" background="transparent" hidden></gcode-model-viewer>
        <div class="sc-legend-card" id="legendCard" hidden>
          <span class="gp-eyebrow" id="legendTitle"></span>
          <div class="gp-legend" id="legend"></div>
        </div>
        <div class="sc-cam">
          <button class="gp-icon-btn gp-on" data-view="iso" title="Iso view">I</button>
          <button class="gp-icon-btn" data-view="top" title="Top view">T</button>
          <button class="gp-icon-btn" data-view="front" title="Front view">F</button>
        </div>
        <div class="sc-count" id="count" hidden></div>
      </div>

      <aside class="sc-rail">
        <div class="gp-scroll">
          <!-- Preview-only panels: appearance / filter / diagnostics of the sliced toolpath. -->
          <div id="previewPanels">
          <section class="gp-panel">
            <h3>Appearance</h3>
            <div class="gp-field">
              <label for="mode">Color by</label>
              <select id="mode" class="gp-input"></select>
              <span class="gp-reason" id="modeReason"></span>
            </div>
          </section>

          <section class="gp-panel">
            <h3>Filter</h3>
            <div class="gp-field" id="layerField" hidden>
              <label>Top layer <span class="gp-value" id="layerValue">0 / 0</span></label>
              <input class="gp-range" id="layer" type="range" min="0" max="0" value="0" />
            </div>
            <label class="gp-toggle" id="hideRow">
              <span>Hide skirt &amp; brim <span class="gp-reason" id="hideReason"></span></span>
              <input type="checkbox" id="hide" />
            </label>
            <label class="gp-toggle">
              <span>Show travel moves</span>
              <input type="checkbox" id="travel" />
            </label>
            <label class="gp-toggle" id="retractRow">
              <span>Show retractions <span class="gp-reason" id="retractReason"></span></span>
              <input type="checkbox" id="retract" />
            </label>
          </section>

          <section class="gp-panel">
            <h3>Diagnostics</h3>
            <button class="gp-btn" id="stats" disabled>Read render stats</button>
            <div class="gp-mono" id="statsOut" style="margin-top: var(--gp-space-3)"></div>
            <p class="gp-reason" id="pickOut" style="margin-top: var(--gp-space-2)"></p>
          </section>
          </div>

          <!-- Prepare-only panel: what the source model exposes (objects / placements / material tier). -->
          <section class="gp-panel" id="modelPanel" hidden>
            <h3>Source model</h3>
            <p class="gp-reason" id="modelBlurb" style="margin-bottom: var(--gp-space-3)"></p>
            <div class="gp-mono" id="modelInfo"></div>
          </section>
        </div>
      </aside>
    </div>

    <footer class="sc-status">
      <div class="sc-caps" id="caps"></div>
      <div class="sc-spacer"></div>
      <span id="disclosure">Pick a fixture to begin.</span>
    </footer>

    <script type="module" src="/src/showcase.js"></script>
  </body>
</html>
