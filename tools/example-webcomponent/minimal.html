<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gcode-preview element — minimal</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #10151b;
        color: #dfe7ef;
        height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
      }
      header {
        display: flex;
        gap: 0.75rem;
        align-items: center;
        padding: 0.75rem 1rem;
        border-bottom: 1px solid #2a3542;
      }
      header strong {
        font-size: 0.9rem;
      }
      header label {
        font-size: 0.85rem;
        color: #9fb0c0;
      }
      /* The element fills its grid cell; give it a definite box to render into. */
      gcode-preview {
        display: block;
        min-height: 0;
      }
    </style>
  </head>
  <body>
    <header>
      <strong>gcode-preview element · minimal</strong>
      <select id="fixture">
        <option value="" selected disabled>Load a fixture…</option>
        <option value="3DBenchy.gcode">3DBenchy.gcode</option>
        <option value="calicat.gcode">calicat.gcode</option>
        <option value="vase.gcode">vase.gcode</option>
        <option value="mach3.gcode">mach3.gcode</option>
      </select>
      <label id="layerLabel" hidden>
        Layer <span id="layerNum">0</span> / <span id="layerMax">0</span>
        <input id="layer" type="range" min="0" max="0" value="0" />
      </label>
    </header>
    <!-- The element renders here. `source` is a property (objects can't be attributes). -->
    <gcode-preview id="view"></gcode-preview>
    <script type="module" src="/src/minimal.js"></script>
  </body>
</html>
