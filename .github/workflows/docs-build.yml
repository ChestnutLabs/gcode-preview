# E11 (DD-013 D6): verify the docs site (SDK manual + API reference) builds.
# NON-REQUIRED — intentionally not a branch-protection check. `npm run docs:build`
# builds the ten @chestnutlabs/* packages in dependency order, runs both typedoc
# projects, and enforces the phase-4 accuracy gate (DD-013 D5): the build FAILS if
# typedoc warnings exceed the known-benign baseline (a new broken @link, rewritten
# reference, etc.). TSDoc syntax is separately linted (warn) via eslint-plugin-tsdoc.
name: Docs — API reference build

on:
  pull_request:
    branches: [main, dev]

jobs:
  docs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
      - run: npm ci
      # Ordered package build + typedoc (packages mode) → docs-site/api.
      - run: npm run docs:build
      - uses: actions/upload-artifact@v4
        with:
          name: api-reference
          path: docs-site
          if-no-files-found: error
          retention-days: 14
